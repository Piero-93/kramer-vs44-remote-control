<!DOCTYPE html>
<!--
  kramer-vs44-remote-control - web UI for a Kramer VS-44HN HDMI matrix.
  Copyright (C) 2026 Piero Biagini. Licensed under the GNU GPL v3 or later.

  Deliberately one self-contained file: no framework, no build step, no external
  request. Commands go out with fetch(), state comes in over Server-Sent Events,
  and both are native browser features.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kramer VS-44HN</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --line: #dcdfe4; --text: #1a1d21;
    --muted: #6b7280; --accent: #1f7a4d; --accent-text: #fff;
    --danger: #b03030; --idle: #f0f1f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --panel: #1e2126; --line: #32363d; --text: #e8eaed;
      --muted: #9aa0a8; --accent: #2f9d63; --accent-text: #0d0f11;
      --danger: #e06b6b; --idle: #262a30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1rem; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 46rem; margin: 0 auto; }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
  h2 {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 .6rem; font-weight: 600;
  }
  header {
    display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  #link { font-size: .85rem; color: var(--muted); }
  #link::before {
    content: "●"; margin-right: .3rem; color: var(--danger);
  }
  #link.up::before { color: var(--accent); }
  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: .9rem; margin-bottom: .9rem;
  }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 22rem; }
  th, td { padding: .2rem; text-align: center; }
  th { font-weight: 500; font-size: .85rem; color: var(--muted); }
  th.out, td.out { text-align: left; white-space: nowrap; }
  button {
    font: inherit; color: inherit; background: var(--idle);
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    padding: .5rem .6rem; min-width: 2.6rem; min-height: 2.6rem;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  td button { width: 100%; }
  button.on {
    background: var(--accent); color: var(--accent-text);
    border-color: var(--accent); font-weight: 600;
  }
  button.arm { border-color: var(--danger); color: var(--danger); }
  button.arm.active {
    background: var(--danger); color: #fff; border-color: var(--danger);
    font-weight: 600;
  }
  .dot { color: var(--accent); font-size: .7em; vertical-align: .15em; }
  button.arm .dot { color: currentColor; }
  .hint { color: var(--muted); font-size: .85rem; }
  .hint.warn { color: var(--danger); }
  #presets { display: grid; gap: .5rem; grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 34rem) {
    #presets { grid-template-columns: repeat(4, 1fr); }
  }
  #presets button { text-align: left; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  input[type=text] {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: .35rem .4rem;
    width: 100%; min-width: 5rem;
  }
  #toast {
    position: fixed; left: 1rem; right: 1rem; bottom: 1rem; margin: 0 auto;
    max-width: 30rem; background: var(--danger); color: #fff;
    padding: .6rem .8rem; border-radius: 8px; font-size: .9rem;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  #toast[hidden] { display: none; }
  footer { color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kramer VS-44HN</h1>
    <span id="link">connecting…</span>
  </header>

  <section>
    <h2>Routing</h2>
    <div class="scroll">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="grid"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>Presets</h2>
    <div id="presets"></div>
    <div class="row" style="margin-top:.7rem">
      <button id="arm" class="arm" hidden>Overwrite a preset…</button>
      <span id="presetHint" class="hint"></span>
    </div>
  </section>

  <section>
    <div class="row">
      <button id="rename">Edit names</button>
      <span id="renameHint" class="muted"></span>
    </div>
    <div id="editor" hidden></div>
  </section>

  <footer>Run one controller at a time: the matrix does not report another
    client's switches.</footer>
</main>

<div id="toast" hidden></div>

<script>
"use strict";

const N_IO = 4, N_PRESETS = 8;
const $ = (id) => document.getElementById(id);

let state = { connected: false, routing: {}, presets: {}, detail: "", error: null };
let labels = { inputs: [], outputs: [], presets: [] };
let busy = false;
// Storing overwrites a preset and is the only destructive action here, so it is
// never one tap away from recalling: it needs this mode plus a confirmation.
let armed = false;

/* ---------- rendering ---------------------------------------------------- */

function renderLink() {
  const el = $("link");
  el.classList.toggle("up", state.connected);
  if (state.connected) {
    el.textContent = `${state.detail}${state.protocol ? " — " + state.protocol : ""}`;
  } else {
    el.textContent = state.error || "not connected to the matrix";
  }
}

function renderGrid() {
  const head = $("head");
  head.textContent = "";
  head.appendChild(th("output \\ input", "out"));
  for (let i = 1; i <= N_IO; i++) head.appendChild(th(labels.inputs[i - 1]));
  head.appendChild(th("off"));

  const body = $("grid");
  body.textContent = "";
  for (let o = 1; o <= N_IO; o++) {
    const tr = document.createElement("tr");
    const name = document.createElement("td");
    name.className = "out";
    name.textContent = labels.outputs[o - 1];
    tr.appendChild(name);
    for (let i = 1; i <= N_IO; i++) tr.appendChild(cell(i, o));
    tr.appendChild(cell(0, o, "×"));
    body.appendChild(tr);
  }
}

function th(text, cls) {
  const el = document.createElement("th");
  el.textContent = text;
  if (cls) el.className = cls;
  return el;
}

function cell(input, output, text) {
  const td = document.createElement("td");
  const b = document.createElement("button");
  b.textContent = text || String(input);
  b.disabled = busy || !state.connected;
  if (Number(state.routing[output]) === input) b.classList.add("on");
  b.title = input === 0
    ? `Disconnect ${labels.outputs[output - 1]}`
    : `${labels.inputs[input - 1]} to ${labels.outputs[output - 1]}`;
  b.onclick = () => route(input, output);
  td.appendChild(b);
  return td;
}

function renderPresets() {
  const box = $("presets");
  box.textContent = "";
  for (let n = 1; n <= N_PRESETS; n++) {
    const b = document.createElement("button");
    b.append(labels.presets[n - 1]);
    if (state.presets && state.presets[n]) {
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.textContent = " ●";
      dot.title = "holds a layout";
      b.appendChild(dot);
    }
    b.disabled = busy || !state.connected;
    if (armed) {
      b.classList.add("arm");
      b.title = `Overwrite ${labels.presets[n - 1]} with the current routing`;
      b.onclick = () => store(n);
    } else {
      b.title = `Recall ${labels.presets[n - 1]}`;
      b.onclick = () => recall(n);
    }
    box.appendChild(b);
  }

  const arm = $("arm");
  arm.hidden = !state.allow_preset_store;
  arm.classList.toggle("active", armed);
  arm.textContent = armed ? "Cancel" : "Overwrite a preset…";
  arm.disabled = busy || !state.connected;
  const hint = $("presetHint");
  hint.className = armed ? "hint warn" : "hint";
  if (armed) {
    hint.textContent = "Pick a preset to overwrite with the routing shown above.";
  } else if (state.allow_preset_store) {
    hint.textContent = "● marks a preset that already holds a layout.";
  } else {
    hint.textContent = "Overwriting presets is disabled on this service.";
  }
}

function renderAll() { renderLink(); renderGrid(); renderPresets(); }

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.hidden = true; }, 6000);
}

/* ---------- talking to the service -------------------------------------- */

async function send(method, path, body) {
  busy = true;
  renderAll();
  try {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const payload = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(payload.error || `HTTP ${res.status}`);
    return payload;
  } catch (e) {
    toast(e.message);
    return null;
  } finally {
    busy = false;
    renderAll();
  }
}

async function route(input, output) {
  const res = await send("POST", "/api/route", { input, output });
  if (res) { state = res; renderAll(); }
}

async function recall(n) {
  const res = await send("POST", `/api/preset/${n}/recall`);
  if (res) { state = res; renderAll(); }
}

function routingSummary() {
  const lines = [];
  for (let o = 1; o <= N_IO; o++) {
    const i = Number(state.routing[o]);
    lines.push(`  ${labels.outputs[o - 1]} ← ` +
               (i === 0 ? "nothing" : labels.inputs[i - 1]));
  }
  return lines.join("\n");
}

async function store(n) {
  // Say what is about to happen, not just "are you sure": a warning nobody can
  // act on is a warning everybody clicks through.
  const name = labels.presets[n - 1];
  const occupied = state.presets && state.presets[n];
  const message =
    `Store the current routing into "${name}"?\n\n${routingSummary()}\n\n` +
    (occupied ? `"${name}" already holds a layout and it will be lost.`
              : `"${name}" is currently empty.`);
  if (!confirm(message)) return;
  const res = await send("POST", `/api/preset/${n}/store`);
  if (res) {
    state = res;
    armed = false;
    renderAll();
    $("presetHint").textContent = `Saved into "${name}".`;
  }
}

$("arm").onclick = () => { armed = !armed; renderPresets(); };

/* ---------- editing the names ------------------------------------------- */

const GROUPS = [
  ["inputs", "Inputs", N_IO],
  ["outputs", "Outputs", N_IO],
  ["presets", "Presets", N_PRESETS],
];

function buildEditor() {
  const box = $("editor");
  box.textContent = "";
  for (const [key, title, count] of GROUPS) {
    const h = document.createElement("h2");
    h.textContent = title;
    h.style.marginTop = ".8rem";
    box.appendChild(h);
    const row = document.createElement("div");
    row.id = `edit-${key}`;
    row.className = "row";
    for (let i = 0; i < count; i++) {
      const input = document.createElement("input");
      input.type = "text";
      input.value = labels[key][i];
      input.maxLength = 40;
      input.style.flex = "1 1 7rem";
      row.appendChild(input);
    }
    box.appendChild(row);
  }
  const actions = document.createElement("div");
  actions.className = "row";
  actions.style.marginTop = ".8rem";
  const save = document.createElement("button");
  save.textContent = "Save names";
  save.onclick = saveNames;
  actions.appendChild(save);
  box.appendChild(actions);
}

async function saveNames() {
  const payload = {};
  for (const [key] of GROUPS) {
    payload[key] = [...$(`edit-${key}`).querySelectorAll("input")]
      .map((el) => el.value.trim() || "—");
  }
  const res = await send("PUT", "/api/labels", payload);
  if (res) {
    labels = res;
    renderAll();
    $("editor").hidden = true;
    $("rename").textContent = "Edit names";
    $("renameHint").textContent = "saved";
    setTimeout(() => { $("renameHint").textContent = ""; }, 3000);
  }
}

$("rename").onclick = () => {
  const editor = $("editor");
  editor.hidden = !editor.hidden;
  if (!editor.hidden) buildEditor();
  $("rename").textContent = editor.hidden ? "Edit names" : "Cancel";
};

/* ---------- live state -------------------------------------------------- */

function listen() {
  // EventSource reconnects on its own, so a service restart or a flaky network
  // needs no handling here beyond showing that the stream is down.
  const stream = new EventSource("/api/events");
  stream.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === "state") {
      state = msg.state;
      // Do not leave a destructive mode armed across a dropped link: the
      // routing it was about to capture may no longer be the one shown.
      if (!state.connected) armed = false;
      renderAll();
    }
    if (msg.type === "labels") { labels = msg.labels; renderAll(); }
  };
  stream.onerror = () => {
    state = { ...state, connected: false, error: "no connection to the service" };
    renderLink();
  };
}

(async function start() {
  const got = await send("GET", "/api/labels");
  if (got) labels = got;
  renderAll();
  listen();
})();
</script>
</body>
</html>
