<!DOCTYPE html>
<!--
  kramer-vs44-remote-control - web UI for a Kramer VS-44HN HDMI matrix.
  Copyright (C) 2026 Piero Biagini. Licensed under the GNU GPL v3 or later.

  Deliberately one self-contained file: no framework, no build step, no external
  request. Commands go out with fetch(), state comes in over Server-Sent Events,
  and both are native browser features.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1f7a4d">
<title>Kramer VS-44HN</title>
<!-- Inline so the page stays a single file with no external request: a 2x2 grid,
     which is what reads at 16 px better than an actual 4x4 would. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231f7a4d'/><g fill='%23fff'><rect x='7' y='7' width='8' height='8' rx='2'/><rect x='17' y='7' width='8' height='8' rx='2'/><rect x='7' y='17' width='8' height='8' rx='2'/><rect x='17' y='17' width='8' height='8' rx='2'/></g></svg>">
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --line: #dcdfe4; --text: #1a1d21;
    --muted: #6b7280; --accent: #1f7a4d; --accent-text: #fff;
    --danger: #b03030; --idle: #f0f1f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --panel: #1e2126; --line: #32363d; --text: #e8eaed;
      --muted: #9aa0a8; --accent: #2f9d63; --accent-text: #0d0f11;
      --danger: #e06b6b; --idle: #262a30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1rem; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 46rem; margin: 0 auto; }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
  h2 {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 .6rem; font-weight: 600;
  }
  header {
    display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  #link { font-size: .85rem; color: var(--muted); }
  #link::before {
    content: "●"; margin-right: .3rem; color: var(--danger);
  }
  #link.up::before { color: var(--accent); }
  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: .9rem; margin-bottom: .9rem;
  }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 22rem; }
  th, td { padding: .2rem; text-align: center; }
  th { font-weight: 500; font-size: .85rem; color: var(--muted); }
  th.out, td.out { text-align: left; white-space: nowrap; }
  button {
    font: inherit; color: inherit; background: var(--idle);
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    padding: .5rem .6rem; min-width: 2.6rem; min-height: 2.6rem;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  td button { width: 100%; }
  button.on {
    background: var(--accent); color: var(--accent-text);
    border-color: var(--accent); font-weight: 600;
  }
  button.arm { border-color: var(--danger); color: var(--danger); }
  .hint { color: var(--muted); font-size: .85rem; }
  .hint.warn { color: var(--danger); }
  #presets { display: grid; gap: .5rem; grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 34rem) {
    #presets { grid-template-columns: repeat(4, 1fr); }
  }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  input[type=text] {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: .35rem .4rem;
    width: 100%; min-width: 5rem;
  }
  #toast {
    position: fixed; left: 1rem; right: 1rem; bottom: 1rem; margin: 0 auto;
    max-width: 30rem; background: var(--danger); color: #fff;
    padding: .6rem .8rem; border-radius: 8px; font-size: .9rem;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  #toast[hidden] { display: none; }
  footer { color: var(--muted); font-size: .8rem; text-align: center; }

  /* Names are edited where they are read, so in the grid one has to look like
     the label it replaces until you reach for it: a table of form fields would
     read as a form rather than as a routing matrix. */
  input.name {
    font: inherit; color: inherit; background: transparent;
    border: 1px solid transparent; border-radius: 6px; text-align: center;
    padding: .35rem .4rem; width: 100%; min-width: 4.5rem;
  }
  th input.name { font-size: .85rem; color: var(--muted); font-weight: 500; }
  td.out input.name { text-align: left; }
  input.name:hover { border-color: var(--line); }
  input.name:focus {
    outline: none; background: var(--bg); border-color: var(--muted);
    color: var(--text);
  }

  /* A preset is one tile: the wide half recalls, the narrow one opens that
     slot's own panel. The tile carries the border, so the two halves highlight
     as the single control they are. */
  .tile {
    display: flex; border: 1px solid var(--line); border-radius: 8px;
    background: var(--idle); overflow: hidden;
  }
  .tile:hover { border-color: var(--muted); }
  .tile button {
    border: 0; border-radius: 0; background: transparent; min-width: 0;
  }
  .tile .go {
    flex: 1 1 auto; text-align: left; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .tile .more {
    flex: 0 0 auto; text-align: center; min-width: 2.2rem;
    padding: .5rem .45rem; color: var(--muted);
    border-left: 1px solid var(--line);
  }
  /* An empty slot is drawn as an empty bay rather than as a broken button:
     nothing to recall, but still somewhere to put something. */
  .tile.empty { background: transparent; border-style: dashed; }
  .tile.empty .go { color: var(--muted); }
  .tile.active { background: var(--accent); border-color: var(--accent); }
  .tile.active button { color: var(--accent-text); font-weight: 600; }
  .tile.active .more { border-left-color: rgba(127, 127, 127, .4); }

  #presetPanel {
    margin-top: .7rem; padding: .8rem; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
  }
  #presetPanel[hidden] { display: none; }
  #presetPanel h3 {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 .6rem; font-weight: 600;
  }
  .field { display: flex; gap: .5rem; align-items: center; }
  .field label { flex: 0 0 auto; color: var(--muted); font-size: .85rem; }
  .field input { flex: 1 1 auto; }
  .capture { margin: .7rem 0; }
  #lockState .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kramer VS-44HN</h1>
    <span id="link">connecting…</span>
    <span id="live" class="hint"></span>
    <span id="notice" class="hint"></span>
  </header>

  <section>
    <h2>Routing</h2>
    <div class="scroll">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="grid"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>Presets</h2>
    <div id="presets"></div>
    <div id="presetPanel" hidden></div>
  </section>

  <section>
    <h2>Front panel</h2>
    <div class="row">
      <span id="lockState"></span>
      <button id="lockBtn" class="arm" hidden>Lock front panel</button>
      <button id="unlockBtn" hidden>Unlock front panel</button>
    </div>
  </section>

  <footer>Run one controller at a time: the matrix does not report another
    client's switches.</footer>
</main>

<div id="toast" hidden></div>

<script>
"use strict";

const N_IO = 4, N_PRESETS = 8;
const $ = (id) => document.getElementById(id);

let state = { connected: false, routing: {}, presets: {}, active_preset: null,
              detail: "", error: null };
// Seeded with the same defaults the service uses rather than left empty. The
// first render happens before GET /api/labels has answered - send() renders as
// soon as it sets busy - and empty arrays would put the string "undefined" in
// every tile and column heading for that instant.
let labels = {
  inputs: Array.from({ length: N_IO }, (_, i) => `IN ${i + 1}`),
  outputs: Array.from({ length: N_IO }, (_, i) => `OUT ${i + 1}`),
  presets: Array.from({ length: N_PRESETS }, (_, i) => `Preset ${i + 1}`),
};
let busy = false;

// Overwriting a preset and emptying one are the only destructive actions here,
// and they live inside one slot's own panel rather than in a second list of
// eight buttons. Two properties make that safe, and both are worth keeping if
// this is ever rearranged:
//
//   1. Tapping a preset only ever recalls it. The destructive controls are not
//      in the document at all until that slot's panel is opened, so there is no
//      armed state to forget about and no mode that changes what a tap does.
//   2. Everything inside the panel is about ONE named slot. The layout this
//      replaced offered eight identical red squares labelled 1-8, which put the
//      least information on the riskiest path.
//
// The real gate is still the service: without --allow-preset-changes both
// endpoints answer 403 and the buttons below are never rendered.
let openPreset = null;      // the slot whose panel is showing, or null
let panelFor = null;        // the slot the panel was last built for

// Transient confirmations have to survive a re-render: a store publishes a state
// event that comes straight back, so anything written directly into the DOM
// would be wiped a few milliseconds later.
let notice = "";
let streamUp = false;
let lastEvent = 0;

function canChangePresets() {
  // allow_preset_store is the deprecated spelling, still sent so a page loaded
  // before an upgrade keeps working. Prefer the current one.
  return !!(state.allow_preset_changes ?? state.allow_preset_store);
}

function say(message) {
  notice = message;
  renderNotice();
  clearTimeout(say.timer);
  say.timer = setTimeout(() => { notice = ""; renderNotice(); }, 4000);
}

function renderNotice() {
  $("notice").textContent = notice ? "· " + notice : "";
}

/* ---------- rendering ---------------------------------------------------- */

function renderLink() {
  const el = $("link");
  el.classList.toggle("up", state.connected);
  el.textContent = state.connected
    ? `${state.detail}${state.protocol ? " — " + state.protocol : ""}`
    : (state.error || "not connected to the matrix");

  // Whether this page is still being fed, and when it last heard anything. A
  // control panel that has silently stopped listening looks exactly like one
  // where nothing is happening, and that is the failure worth making visible.
  const live = $("live");
  if (!streamUp) {
    live.textContent = "· not receiving updates";
    live.className = "hint warn";
    return;
  }
  const age = Math.round((Date.now() - lastEvent) / 1000);
  live.textContent = `· live, last update ${age < 2 ? "just now" : age + "s ago"}`;
  live.className = "hint";
}

/* ---------- the routing grid -------------------------------------------- */

// Built once and updated in place, never rebuilt. It holds text fields now, and
// replacing the node under a field being typed into would throw the keystrokes
// away - state events arrive while somebody is renaming an output.
let grid = null;

function buildGrid() {
  const head = $("head");
  head.textContent = "";
  head.appendChild(th("output \\ input", "out"));

  const inputNames = [];
  for (let i = 1; i <= N_IO; i++) {
    const cell = document.createElement("th");
    const field = nameField("inputs", i - 1);
    cell.appendChild(field);
    inputNames.push(field);
    head.appendChild(cell);
  }
  head.appendChild(th("off"));

  const body = $("grid");
  body.textContent = "";
  const outputNames = [], buttons = [];
  for (let o = 1; o <= N_IO; o++) {
    const tr = document.createElement("tr");
    const name = document.createElement("td");
    name.className = "out";
    const field = nameField("outputs", o - 1);
    name.appendChild(field);
    outputNames.push(field);
    tr.appendChild(name);
    for (let i = 1; i <= N_IO; i++) {
      const b = routeButton(i, o, String(i));
      buttons.push({ b, input: i, output: o });
      tr.appendChild(wrap(b));
    }
    const disconnect = routeButton(0, o, "×");
    buttons.push({ b: disconnect, input: 0, output: o });
    tr.appendChild(wrap(disconnect));
    body.appendChild(tr);
  }
  grid = { inputNames, outputNames, buttons };
}

function renderGrid() {
  if (!grid) buildGrid();
  setFieldValues(grid.inputNames, "inputs");
  setFieldValues(grid.outputNames, "outputs");
  for (const { b, input, output } of grid.buttons) {
    b.disabled = busy || !state.connected;
    b.classList.toggle("on", Number(state.routing[output]) === input);
    b.title = input === 0
      ? `Disconnect ${labels.outputs[output - 1]}`
      : `${labels.inputs[input - 1]} to ${labels.outputs[output - 1]}`;
  }
}

// Never while it has the caret: another client renaming something would
// otherwise overwrite what is being typed here mid-word.
function setFieldValues(fields, key) {
  fields.forEach((el, i) => {
    if (el !== document.activeElement) el.value = labels[key][i] ?? "";
  });
}

function th(text, cls) {
  const el = document.createElement("th");
  el.textContent = text;
  if (cls) el.className = cls;
  return el;
}

function wrap(node) {
  const td = document.createElement("td");
  td.appendChild(node);
  return td;
}

function routeButton(input, output, text) {
  const b = document.createElement("button");
  b.textContent = text;
  b.onclick = () => route(input, output);
  return b;
}

/* ---------- editing a name ----------------------------------------------- */

function nameField(key, index) {
  const el = document.createElement("input");
  el.type = "text";
  el.className = "name";
  el.maxLength = 40;
  el.value = labels[key][index] ?? "";
  el.setAttribute("aria-label", `Name for ${key.slice(0, -1)} ${index + 1}`);
  // Saved on the way out rather than behind a button: there is nothing to
  // forget to press, and nothing left unsaved when the tab is closed.
  el.onchange = () => saveLabel(key, index, el.value);
  el.onkeydown = (e) => { if (e.key === "Enter") el.blur(); };
  return el;
}

async function saveLabel(key, index, value) {
  const clean = value.trim().slice(0, 40) || "—";
  if (labels[key][index] === clean) return;     // nothing to write
  const next = [...labels[key]];
  next[index] = clean;
  const res = await send("PUT", "api/labels", { [key]: next });
  if (res) {
    labels = res;
    renderAll();
    say("Name saved");
  } else {
    renderAll();          // put the field back to what is actually stored
  }
}

/* ---------- presets ------------------------------------------------------ */

function renderPresets() {
  const box = $("presets");
  box.textContent = "";
  for (let n = 1; n <= N_PRESETS; n++) box.appendChild(presetTile(n));
  renderPresetPanel();
}

function presetTile(n) {
  // Occupancy needs no mark of its own here: the service reads it before it
  // reports the link as up, so by the time this renders, "empty" is known
  // rather than merely unread, and an empty bay already looks like one. The
  // Tkinter window keeps its dot because there the probes are queued after the
  // link comes up, so "not read yet" is a state a user can actually see.
  const knownEmpty = state.presets && state.presets[n] === false;
  const active = state.active_preset === n;

  const tile = document.createElement("div");
  tile.className = "tile" + (knownEmpty ? " empty" : "") + (active ? " active" : "");

  const go = document.createElement("button");
  go.className = "go";
  go.textContent = labels.presets[n - 1];
  go.disabled = busy || !state.connected || knownEmpty;
  go.title = knownEmpty
    ? `${labels.presets[n - 1]} is empty`
    : `Recall ${labels.presets[n - 1]}`;
  if (active) go.setAttribute("aria-current", "true");
  go.onclick = () => recall(n);
  tile.appendChild(go);

  const more = document.createElement("button");
  more.className = "more";
  more.textContent = "⋯";
  more.title = `Rename or change ${labels.presets[n - 1]}`;
  more.setAttribute("aria-expanded", String(openPreset === n));
  more.onclick = () => {
    openPreset = openPreset === n ? null : n;
    renderPresets();
  };
  tile.appendChild(more);
  return tile;
}

function routingLines() {
  const lines = [];
  for (let o = 1; o <= N_IO; o++) {
    const i = Number(state.routing[o]);
    lines.push(`${labels.outputs[o - 1]} ← ` +
               (i === 0 ? "nothing" : labels.inputs[i - 1]));
  }
  return lines;
}

// Rebuilt only when a different slot is opened. Everything else is updated in
// place, for the same reason the grid is: the name field here is a text box,
// and a store publishes a state event that arrives while it may have the caret.
function renderPresetPanel() {
  const box = $("presetPanel");
  if (openPreset === null) {
    box.hidden = true;
    box.textContent = "";
    panelFor = null;
    return;
  }
  box.hidden = false;
  if (panelFor !== openPreset) {
    buildPresetPanel(openPreset);
    panelFor = openPreset;
  }
  updatePresetPanel(openPreset);
}

function buildPresetPanel(n) {
  const box = $("presetPanel");
  box.textContent = "";

  const title = document.createElement("h3");
  title.id = "panelTitle";
  box.appendChild(title);

  const field = document.createElement("div");
  field.className = "field";
  const label = document.createElement("label");
  label.textContent = "Name";
  label.htmlFor = "panelName";
  field.appendChild(label);
  const input = nameField("presets", n - 1);
  input.className = "";                 // a form field here, not a grid label
  input.id = "panelName";
  field.appendChild(input);
  box.appendChild(field);

  const capture = document.createElement("div");
  capture.className = "hint capture";
  capture.id = "panelCapture";
  box.appendChild(capture);

  const actions = document.createElement("div");
  actions.className = "row";
  const store = document.createElement("button");
  store.className = "arm";
  store.id = "panelStore";
  store.textContent = "Overwrite with the current routing";
  store.onclick = () => storePreset(n);
  actions.appendChild(store);
  const wipe = document.createElement("button");
  wipe.className = "arm";
  wipe.id = "panelDelete";
  wipe.textContent = "Empty this preset";
  wipe.onclick = () => deletePreset(n);
  actions.appendChild(wipe);
  const note = document.createElement("span");
  note.id = "panelNote";
  actions.appendChild(note);
  box.appendChild(actions);
}

function updatePresetPanel(n) {
  $("panelTitle").textContent = labels.presets[n - 1];
  const field = $("panelName");
  if (field !== document.activeElement) field.value = labels.presets[n - 1];

  const allowed = canChangePresets();
  // Rebuilt on every state change, so the layout listed here is the one that
  // would actually be captured rather than whatever it was when opened.
  const capture = $("panelCapture");
  capture.textContent = "";
  if (allowed) {
    const head = document.createElement("div");
    head.textContent = "Overwriting would capture:";
    capture.appendChild(head);
    for (const line of routingLines()) {
      const div = document.createElement("div");
      div.textContent = line;
      capture.appendChild(div);
    }
  }

  const occupied = state.presets && state.presets[n];
  const store = $("panelStore"), wipe = $("panelDelete");
  store.hidden = !allowed;
  wipe.hidden = !allowed;
  store.disabled = busy || !state.connected;
  // Nothing to empty, and no button offering to: the device accepts the command
  // on an empty slot, but a control that cannot change anything is noise.
  wipe.disabled = busy || !state.connected || occupied === false;
  $("panelNote").className = allowed ? "hint" : "hint warn";
  $("panelNote").textContent = allowed
    ? "" : "Changing presets is disabled on this service; renaming is not.";
}

async function recall(n) {
  const res = await send("POST", `api/preset/${n}/recall`);
  if (res) { state = res; renderAll(); }
}

async function storePreset(n) {
  // Say what is about to happen, not just "are you sure": a warning nobody can
  // act on is a warning everybody clicks through.
  const name = labels.presets[n - 1];
  const occupied = state.presets && state.presets[n];
  const message =
    `Store the current routing into "${name}"?\n\n` +
    routingLines().map((l) => "  " + l).join("\n") + "\n\n" +
    (occupied ? `"${name}" already holds a layout and it will be lost.`
              : `"${name}" is currently empty.`);
  if (!confirm(message)) return;
  const res = await send("POST", `api/preset/${n}/store`);
  if (res) {
    state = res;
    renderAll();
    say(`Saved into "${name}"`);
  }
}

async function deletePreset(n) {
  const name = labels.presets[n - 1];
  // The second sentence is the one that matters: a red button next to a routing
  // grid looks like it might black out a monitor, and this one does not.
  if (!confirm(
      `Empty "${name}"?\n\n` +
      "What the slot holds is discarded and cannot be recovered.\n" +
      "The routing on the outputs is not changed.")) return;
  const res = await send("POST", `api/preset/${n}/delete`);
  if (res) {
    state = res;
    renderAll();
    say(`"${name}" emptied`);
  }
}

/* ---------- the front panel ---------------------------------------------- */

// The front panel is the only thing this page reports that somebody standing in
// another room can touch, so an unknown state is shown as unknown. `locked` is
// null until the device has answered, and treating that as "unlocked" would be
// asserting the one fact this control exists to establish.
function renderLock() {
  const known = state.connected && state.locked !== null &&
                state.locked !== undefined;
  const locked = known && state.locked;
  const canLock = !!state.allow_panel_lock;

  const el = $("lockState");
  el.textContent = "";
  if (state.connected) {
    el.append(known ? (locked ? "Locked" : "Unlocked") : "State unknown");
    // Why there is no Lock button, said once and in passing rather than as a
    // second line apologising for an absence.
    if (!canLock) {
      const why = document.createElement("span");
      why.className = "muted";
      why.textContent = " · locking disabled on this service";
      el.appendChild(why);
    }
  }

  // Unlock is offered whatever the service was started with. Locking somebody
  // out of the machine in front of them is the risk; letting them back in is
  // never one, so the release must not depend on a flag set hours ago.
  const lockBtn = $("lockBtn"), unlockBtn = $("unlockBtn");
  lockBtn.hidden = !canLock || !state.connected || locked;
  unlockBtn.hidden = !state.connected || (known && !locked);
  lockBtn.disabled = busy;
  unlockBtn.disabled = busy;
}

async function setLock(locked) {
  if (locked && !confirm(
      "Lock the front panel?\n\n" +
      "The buttons on the matrix itself stop working until it is unlocked. " +
      "Anyone standing at the machine will not be able to use it, and the only " +
      "way back is this page or another controller.")) return;
  const res = await send("POST", "api/lock", { locked });
  if (res) {
    state = res;
    renderAll();
    say(locked ? "Front panel locked" : "Front panel unlocked");
  }
}

$("lockBtn").onclick = () => setLock(true);
$("unlockBtn").onclick = () => setLock(false);

function renderAll() {
  renderLink();
  renderGrid();
  renderPresets();
  renderLock();
  renderNotice();
}

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.hidden = true; }, 6000);
}

/* ---------- talking to the service -------------------------------------- */

// Every path passed here is relative on purpose. A leading slash would ignore
// the prefix a reverse proxy mounts this under, so a page served at
// /kramer-controller/ would call /api/route and get the proxy's 404. Relative
// paths resolve against the page's own address and work either way - at the
// root of a host, or under a path this service never learns about. The mount
// point has to end in a slash for that: /kramer-controller without one
// resolves one level up, so the proxy must redirect it.
async function send(method, path, body) {
  busy = true;
  renderAll();
  try {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const payload = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(payload.error || `HTTP ${res.status}`);
    return payload;
  } catch (e) {
    toast(e.message);
    return null;
  } finally {
    busy = false;
    renderAll();
  }
}

async function route(input, output) {
  const res = await send("POST", "api/route", { input, output });
  if (res) { state = res; renderAll(); }
}

/* ---------- live state -------------------------------------------------- */

function listen() {
  // EventSource reconnects on its own, so a service restart or a flaky network
  // needs no handling here beyond showing that the stream is down.
  const stream = new EventSource("api/events");
  stream.onopen = () => { streamUp = true; renderLink(); };
  stream.onmessage = (event) => {
    streamUp = true;
    lastEvent = Date.now();
    const msg = JSON.parse(event.data);
    if (msg.type === "state") {
      state = msg.state;
      renderAll();
    }
    if (msg.type === "labels") { labels = msg.labels; renderAll(); }
  };
  stream.onerror = () => {
    streamUp = false;
    state = { ...state, connected: false, error: "no connection to the service" };
    renderLink();
  };
}

// Any error here would otherwise be invisible: the page would simply stop
// following the matrix and look like a matrix with nothing to report.
window.onerror = (message, _src, line) => { toast(`page error: ${message} (line ${line})`); };

(async function start() {
  const got = await send("GET", "api/labels");
  if (got) labels = got;
  renderAll();
  listen();
  setInterval(renderLink, 1000);      // keeps the "last update" age honest
})();
</script>
</body>
</html>
